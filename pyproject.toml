[project]
name = "kaggle-mcp"
version = "0.1.0"
description = "MCP server for EDA and ML workflows on Kaggle datasets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic[mcp]>=0.120.2",
    "fastapi>=0.141.1",
    "joblib>=1.5.3",
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.0",
    "mcp[cli]>=1.28.0",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.0",
    "uvicorn[standard]>=0.49.0",
]
